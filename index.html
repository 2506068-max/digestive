  <style>
    :root{--bg:#fbfbfa;--card:#ffffff;--text:#062541;--muted:#58616b;--accent:#0b3b66;--highlight:#ff7a6b;--soft:#f6f7f9;--shadow: 0 8px 24px rgba(10,20,30,0.08);--radius:14px;--touch:44px}
    @media (prefers-color-scheme: dark){:root{ --bg:#071126; --card:#0b1724; --text:#e6eef8; --muted:#99a6b8; --soft:#071827 }}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .wrap{max-width:1100px;margin:24px auto;padding:20px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    h1{font-size:28px;margin:0 0 6px 0}
    p.lead{margin:0;color:var(--muted)}
    .hero{display:flex;gap:20px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(180deg,rgba(11,59,102,0.04),transparent)}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
    .diagram{display:flex;gap:16px;align-items:flex-start}
    svg{width:100%;height:auto;display:block}
    .organ{transition:transform 180ms ease, fill 180ms ease, opacity 180ms ease;cursor:pointer}
    .organ:hover{transform:scale(1.03)}
    .organ.hover{filter:brightness(1.05) saturate(1.08);transform:scale(1.03)}
    .organ.pulse{animation: pulse 2000ms ease-in-out infinite}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
    .organ.selected{transform:scale(1.06);filter:drop-shadow(0 8px 24px rgba(0,0,0,0.12))}
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
    .swatch{width:16px;height:16px;border-radius:4px}
    .org-list{margin:10px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
    .org-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:10px}
    .org-btn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px;width:100%;text-align:left}
    .org-btn:focus{outline:2px solid rgba(20,115,230,0.12);box-shadow:0 0 0 4px rgba(20,115,230,0.06);border-radius:8px}
    .detail{position:relative}
    .detail .content{min-height:140px;transition:opacity 200ms ease,transform 200ms ease}
    .detail .content.hidden{opacity:0;transform:translateY(8px)}
    .back-top{position:fixed;right:18px;bottom:18px;background:var(--accent);color:white;border-radius:10px;padding:8px 10px;border:none;box-shadow:var(--shadow);cursor:pointer}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px}
    .modal .inner{background:var(--card);border-radius:12px;padding:12px;max-width:900px;width:100%}
    .hit-area{pointer-events:auto}
    .touch-pad{display:inline-block;width:var(--touch);height:var(--touch)}
    @media (prefers-reduced-motion: reduce){.organ.pulse, .organ, .detail .content{animation:none;transition:none}}
  </style>
